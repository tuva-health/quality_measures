version: 2

unit_tests:
  - name: test_cqm130_denominator_scopes_encounters_to_data_source
    description: >
      A qualifying encounter in one source must not create a denominator row
      for the same person in another source.
    model: quality_measures__int_cqm130_denominator
    config:
      enabled: "{{ var('claims_enabled', var('clinical_enabled', False)) | as_bool }}"
    given:
      - input: ref('quality_measures__value_sets')
        format: sql
        rows: |
          select
              'unused' as code
            , 'unused' as code_system
            , 'unused' as concept_name
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('quality_measures__stg_core__encounter')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as encounter_start_date
            , cast('2024-01-15' as date) as encounter_end_date
            , 'office visit' as encounter_type
            , 'office based' as encounter_group
      - input: ref('quality_measures__stg_core__procedure')
        format: sql
        rows: |
          select
              'unused' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as procedure_date
            , 'unused' as normalized_code
            , 'unused' as source_code
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('quality_measures__stg_medical_claim')
        format: sql
        rows: |
          select
              'unused' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as claim_start_date
            , cast('2024-01-15' as date) as claim_end_date
            , 'unused' as hcpcs_code
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('quality_measures__int_cqm130__performance_period')
        format: sql
        rows: |
          select
              cast('2024-01-01' as date) as performance_period_begin
            , cast('2024-12-31' as date) as performance_period_end
            , 'CQM130' as measure_id
            , 'Documentation of Current Medications' as measure_name
            , '2024' as measure_version
      - input: ref('quality_measures__stg_core__patient')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
            , cast('1980-01-01' as date) as birth_date
            , cast(null as date) as death_date
          union all
          select
              'person_1'
            , 'source_b'
            , cast('1980-01-01' as date)
            , cast(null as date)
    expect:
      rows:
        - person_id: person_1
          data_source: source_a
          denominator_flag: 1

  - name: test_cqm130_denominator_accepts_procedure_only_encounter
    description: >
      A qualifying procedure supplies the encounter date when no claims date
      exists, so the patient remains eligible for the denominator.
    model: quality_measures__int_cqm130_denominator
    config:
      enabled: "{{ var('claims_enabled', var('clinical_enabled', False)) | as_bool }}"
    given:
      - input: ref('quality_measures__value_sets')
        format: sql
        rows: |
          select
              '99201' as code
            , 'hcpcs' as code_system
            , 'Encounter to Document Medications' as concept_name
      - input: ref('quality_measures__stg_core__encounter')
        format: sql
        rows: |
          select
              'unused' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as encounter_start_date
            , cast('2024-01-15' as date) as encounter_end_date
            , 'unused' as encounter_type
            , 'unused' as encounter_group
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('quality_measures__stg_core__procedure')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
            , cast('2024-06-15' as date) as procedure_date
            , '99201' as normalized_code
            , '99201' as source_code
      - input: ref('quality_measures__stg_medical_claim')
        format: sql
        rows: |
          select
              'unused' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as claim_start_date
            , cast('2024-01-15' as date) as claim_end_date
            , 'unused' as hcpcs_code
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('quality_measures__int_cqm130__performance_period')
        format: sql
        rows: |
          select
              cast('2024-01-01' as date) as performance_period_begin
            , cast('2024-12-31' as date) as performance_period_end
            , 'CQM130' as measure_id
            , 'Documentation of Current Medications' as measure_name
            , '2024' as measure_version
      - input: ref('quality_measures__stg_core__patient')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
            , cast('1980-01-01' as date) as birth_date
            , cast(null as date) as death_date
    expect:
      rows:
        - person_id: person_1
          data_source: source_a
          procedure_encounter_date: '2024-06-15'
          claims_encounter_date: null
          denominator_flag: 1

  - name: test_cqm130_numerator_scopes_evidence_to_data_source
    description: >
      Numerator evidence in one source must not qualify a denominator row in
      another source for the same person and date.
    model: quality_measures__int_cqm130_numerator
    config:
      enabled: "{{ var('claims_enabled', var('clinical_enabled', False)) | as_bool }}"
    given:
      - input: ref('quality_measures__int_cqm130_denominator')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as procedure_encounter_date
            , cast(null as date) as claims_encounter_date
            , cast('2024-01-01' as date) as performance_period_begin
            , cast('2024-12-31' as date) as performance_period_end
            , 'CQM130' as measure_id
            , 'Documentation of Current Medications' as measure_name
            , '2024' as measure_version
          union all
          select
              'person_1'
            , 'source_b'
            , cast('2024-01-15' as date)
            , cast(null as date)
            , cast('2024-01-01' as date)
            , cast('2024-12-31' as date)
            , 'CQM130'
            , 'Documentation of Current Medications'
            , '2024'
      - input: ref('quality_measures__value_sets')
        format: sql
        rows: |
          select
              'MEDS_DOCUMENTED' as code
            , 'hcpcs' as code_system
            , 'Eligible Clinician Attests to Documenting Current Medications' as concept_name
      - input: ref('quality_measures__stg_core__procedure')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as procedure_date
            , 'hcpcs' as normalized_code_type
            , 'hcpcs' as source_code_type
            , 'MEDS_DOCUMENTED' as normalized_code
            , 'MEDS_DOCUMENTED' as source_code
      - input: ref('quality_measures__stg_medical_claim')
        format: sql
        rows: |
          select
              'unused' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as claim_start_date
            , cast('2024-01-15' as date) as claim_end_date
            , 'unused' as hcpcs_code
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
    expect:
      rows:
        - person_id: person_1
          data_source: source_a
          evidence_date: '2024-01-15'
          numerator_flag: 1

  - name: test_cqm130_exclusions_scope_evidence_to_data_source
    description: >
      Exclusion evidence in one source must not exclude a denominator row in
      another source for the same person.
    model: quality_measures__int_cqm130_exclusions
    config:
      enabled: "{{ var('claims_enabled', var('clinical_enabled', False)) | as_bool }}"
    given:
      - input: ref('quality_measures__int_cqm130__performance_period')
        format: sql
        rows: |
          select
              cast('2024-01-01' as date) as performance_period_begin
            , cast('2024-12-31' as date) as performance_period_end
      - input: ref('quality_measures__value_sets')
        format: sql
        rows: |
          select
              'MEDICAL_REASON' as code
            , 'hcpcs' as code_system
            , 'Medical Reason' as concept_name
      - input: ref('quality_measures__stg_core__condition')
        format: sql
        rows: |
          select
              'unused' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as recorded_date
            , 'unused' as claim_id
            , 'unused' as normalized_code_type
            , 'unused' as source_code_type
            , 'unused' as normalized_code
            , 'unused' as source_code
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('quality_measures__stg_core__procedure')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
            , cast('2024-02-15' as date) as procedure_date
            , 'hcpcs' as normalized_code_type
            , 'hcpcs' as source_code_type
            , 'MEDICAL_REASON' as normalized_code
            , 'MEDICAL_REASON' as source_code
      - input: ref('quality_measures__stg_medical_claim')
        format: sql
        rows: |
          select
              'unused' as person_id
            , 'source_a' as data_source
            , cast('2024-01-15' as date) as claim_start_date
            , cast('2024-01-15' as date) as claim_end_date
            , 'unused' as hcpcs_code
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('quality_measures__int_cqm130_denominator')
        format: sql
        rows: |
          select
              'person_1' as person_id
            , 'source_a' as data_source
          union all
          select
              'person_1'
            , 'source_b'
    expect:
      rows:
        - person_id: person_1
          data_source: source_a
          exclusion_date: '2024-02-15'
          exclusion_flag: 1
