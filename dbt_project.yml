name: 'quality_measures'
version: '0.1.0'
config-version: 2
require-dbt-version: ">=1.10.0"

profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  tuva_last_run: '{{ run_started_at.astimezone(modules.pytz.timezone("UTC")) }}'
  # To run quality measures for a period other than current year, uncomment below.
  # quality_measures_period_end: "2020-12-31"

seeds:
  quality_measures:
    value_sets:
      quality_measures:
        quality_measures__concepts:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'quality_measures__concepts.csv', true, true, true) }}"
        quality_measures__measures:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'quality_measures__measures.csv', true, true, true) }}"
        quality_measures__value_sets:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'quality_measures__codes.csv', true, true, true) }}"
      readmissions:
        readmissions__acute_diagnosis_ccs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__acute_diagnosis_ccs.csv', true, true, true) }}"
        readmissions__acute_diagnosis_icd_10_cm:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__acute_diagnosis_icd_10_cm.csv', true, true, true) }}"
        readmissions__always_planned_ccs_diagnosis_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__always_planned_ccs_diagnosis_category.csv', true, true, true) }}"
        readmissions__always_planned_ccs_procedure_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__always_planned_ccs_procedure_category.csv', true, true, true) }}"
        readmissions__exclusion_ccs_diagnosis_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__exclusion_ccs_diagnosis_category.csv', true, true, true) }}"
        readmissions__icd_10_cm_to_ccs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__icd_10_cm_to_ccs.csv', true, true, true) }}"
        readmissions__icd_10_pcs_to_ccs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__icd_10_pcs_to_ccs.csv', true, true, true) }}"
        readmissions__potentially_planned_ccs_procedure_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/quality-measures/' ~ var('quality_measures_seed_version', '1.0.0'), 'readmissions__potentially_planned_ccs_procedure_category.csv', true, true, true) }}"
        readmissions__potentially_planned_icd_10_pcs:
